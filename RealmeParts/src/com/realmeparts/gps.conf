# For a list of supported parameters, you can often find them by inspecting
# /vendor/lib/libloc_core.so or /vendor/lib64/libloc_core.so

# SUPL (Secure User Plane Location)
SUPL_HOST=supl.google.com
SUPL_PORT=7275
SUPL_VER=0x20000
SUPL_MODE=1
SUPL_ES=1
LPP_PROFILE=3
USE_EMERGENCY_PDN_FOR_EMERGENCY_SUPL=1

# XTRA (Assistance Data)
XTRA_SERVER_1=http://xtra1.gpsonextra.net/xtra3grc.bin
XTRA_SERVER_2=http://xtra2.gpsonextra.net/xtra3grc.bin
XTRA_SERVER_3=http://xtra3.gpsonextra.net/xtra3grc.bin
XTRA_VERSION_CHECK=0

# NTP server for time assistance. You can add servers specific to your region.
NTP_SERVER=time.google.com

# Other settings
A_GLONASS_POS_PROTOCOL_SELECT=0
GPS_LOCK=0
INTERMEDIATE_POS=0
ENABLE_WIPER=1

# Capabilities - 0x37 = MSB+MSA+SCHEDULING+ON_DEMAND_TIME+GEOFENCING
CAPABILITIES=0x37

# Accuracy threshold for intermediate positions in meters.
ACCURACY_THRES=5000